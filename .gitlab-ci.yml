# gitlab.com/insight.wavelabs.ai/ds-poc/DataOne — deploy pipeline
#
# On push to main, SSHes into the onestoreproduction staging host and runs
# this repo's own `git pull && docker compose up -d --build` — DataOne is a
# fully self-contained stack there (its own postgres/broker/api/worker/
# beat/frontend), cloned as a sibling directory (~/DataOne) alongside
# onestoreproduction, not built from onestoreproduction's docker-compose.yml.
#
# The frontend is NOT proxied under onestoreproduction's /demo/dataplane/:
# it has no basePath support and bakes its API origin in as an absolute URL
# at build time, so it's served directly on its own ports (3011 UI, 8011
# API) and the OneStore marketplace links out to it rather than iframing it.
#
# Required GitLab CI/CD variables (Settings → CI/CD → Variables, this
# project, masked + protected):
#   ONESTORE_DEPLOY_SSH_KEY   - private key for the deploy user on the host
#   ONESTORE_DEPLOY_HOST      - host/IP the runner can reach this box on
#   ONESTORE_DEPLOY_USER      - ssh user (e.g. ubuntu)
#   ONESTORE_DEPLOY_PATH      - absolute path to this repo's checkout on the
#                               host, e.g. /home/ubuntu/DataOne
#
# One-time host-side setup (not part of this CI job): ~/DataOne/.env needs
# NEXT_PUBLIC_API_URL and DATAONE_BASE_URL set to the real address browsers
# can reach this host on (e.g. http://veltrisone.stage.veltris.com:8011 /
# :3011) — baked into the frontend at build time. Left at localhost
# defaults, the deployed UI only works for browsers on the host itself.

stages:
  - deploy

deploy_dataone:
  stage: deploy
  only:
    - main
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$ONESTORE_DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$ONESTORE_DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "${ONESTORE_DEPLOY_USER}@${ONESTORE_DEPLOY_HOST}"
      "cd ${ONESTORE_DEPLOY_PATH} &&
       git fetch origin main &&
       git reset --hard origin/main &&
       docker compose up -d --build"
