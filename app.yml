# Databricks App Configuration for DataOne
# This tells Databricks how to build and run your application

name: dataone
version: 1.0.0
display_name: "DataOne - Agentic DBA"
description: "AI-powered database engineering platform with multi-source support and Databricks integration"

# Main command to start the application
# Since you have multiple services, we'll start with the backend API
command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8080"

# Working directory inside the container
workdir: /app/backend

# Environment variables for Databricks App mode
env:
  - name: DATABRICKS_NATIVE_MODE
    value: "true"
  - name: DATABASE_URL
    value: "sqlite:///./dataone.db"
  - name: LOG_LEVEL
    value: "INFO"
  - name: DATABRICKS_HOST
    value_from: DATABRICKS_HOST
  - name: DATABRICKS_TOKEN
    value_from: DATABRICKS_TOKEN

# Port the app listens on
port: 8080

# Health check endpoint
health:
  path: /health
  port: 8080
  interval_seconds: 30
  timeout_seconds: 5

# Resources required
resources:
  cpu: "2"
  memory: "4Gi"
  
# Optional: Specify Python version
runtime:
  python_version: "3.11"

# Files to include (if you want to be explicit)
# Otherwise Databricks includes everything from the repo
include:
  - backend/
  - frontend/
  - .env.example
  - README.md
